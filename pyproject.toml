[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-researcher"
version = "0.1.0"
description = "Local-first research engine for quantum computing and AI literature"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16.0",
]

[project.scripts]
airesearch = "ai_researcher.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["docs"]
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_researcher"]
