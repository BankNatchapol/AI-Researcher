[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-researcher"
version = "0.1.0"
description = "A local-first research engine for quantum computing and AI literature."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16,<1",
]

[project.scripts]
airesearch = "ai_researcher.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
