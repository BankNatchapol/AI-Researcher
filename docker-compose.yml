name: ai-researcher

services:
  postgres:
    image: postgres:16
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_researcher}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.9.0-crf
    platform: linux/arm64
    ports:
      - "${GROBID_PORT:-8070}:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive | grep -qx true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
    name: ai-researcher-postgres-data
